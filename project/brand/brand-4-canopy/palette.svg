    <text x="16" y="180" font-size="13" font-family="ui-monospace, monospace" fill="#faf6ee">#1a2e25</text>
  </g>
  <g transform="translate(1040,120)">
    <rect width="120" height="200" rx="16" fill="#faf6ee" stroke="#4a5d52" stroke-width="1"/>
    <text x="16" y="32" font-size="13" font-weight="500" fill="#1a2e25">Paper</text>
    <text x="16" y="156" font-size="20" font-weight="600" fill="#1a2e25" font-family="'Source Serif 4', Georgia, serif">Linen</text>
    <text x="16" y="180" font-size="13" font-family="ui-monospace, monospace" fill="#1a2e25">#faf6ee</text>
