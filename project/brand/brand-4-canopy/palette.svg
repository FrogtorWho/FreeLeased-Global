    <text x="0" y="40">River Stone #4a5d52 · 6.20:1 · AA</text>
    <text x="0" y="58">Parrot Feather #c2410c · 4.83:1 · AA Large</text>
    <text x="0" y="76">Moss Shadow #1c2e25 · 12.34:1 · AAA (dark surface)</text>
    <text x="0" y="94">Forest Floor #1a2e25 · 11.31:1 · AAA</text>
