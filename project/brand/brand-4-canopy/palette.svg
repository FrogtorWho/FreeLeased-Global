<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="480" fill="#faf6ee"/>
  <text x="40" y="56" font-size="28" font-weight="600" fill="#0e3b2e" font-family="'Source Serif 4', Georgia, serif">Canopy — Palette</text>
  <text x="40" y="84" font-size="14" fill="#4a5d52">6 tokens · WCAG AA on Paper #faf6ee</text>

  <g transform="translate(40,120)">
    <rect width="180" height="200" rx="16" fill="#0e3b2e"/>
    <text x="16" y="32" font-size="13" font-weight="500" fill="#faf6ee">Primary</text>
    <text x="16" y="156" font-size="22" font-weight="600" fill="#faf6ee" font-family="'Source Serif 4', Georgia, serif">Deep Forest</text>
    <text x="16" y="180" font-size="13" font-family="ui-monospace, monospace" fill="#faf6ee">#0e3b2e</text>
  </g>
  <g transform="translate(240,120)">
    <rect width="180" height="200" rx="16" fill="#4a5d52"/>
    <text x="16" y="32" font-size="13" font-weight="500" fill="#faf6ee">Secondary</text>
    <text x="16" y="156" font-size="22" font-weight="600" fill="#faf6ee" font-family="'Source Serif 4', Georgia, serif">River Stone</text>
    <text x="16" y="180" font-size="13" font-family="ui-monospace, monospace" fill="#faf6ee">#4a5d52</text>
  </g>
  <g transform="translate(440,120)">
    <rect width="180" height="200" rx="16" fill="#c2410c"/>
    <text x="16" y="32" font-size="13" font-weight="500" fill="#faf6ee">Accent</text>
    <text x="16" y="156" font-size="22" font-weight="600" fill="#faf6ee" font-family="'Source Serif 4', Georgia, serif">Parrot Feather</text>
    <text x="16" y="180" font-size="13" font-family="ui-monospace, monospace" fill="#faf6ee">#c2410c</text>
  </g>
  <g transform="translate(640,120)">
