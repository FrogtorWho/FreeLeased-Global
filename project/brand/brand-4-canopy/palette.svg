    <text x="16" y="32" font-size="13" font-weight="500" fill="#faf6ee">Surface</text>
    <text x="16" y="156" font-size="22" font-weight="600" fill="#faf6ee" font-family="'Source Serif 4', Georgia, serif">Moss Shadow</text>
    <text x="16" y="180" font-size="13" font-family="ui-monospace, monospace" fill="#faf6ee">#1c2e25</text>
  </g>
  <g transform="translate(840,120)">
    <rect width="180" height="200" rx="16" fill="#1a2e25"/>
    <text x="16" y="32" font-size="13" font-weight="500" fill="#faf6ee">Ink</text>
