    <path d="M48 60 C40 60 32 54 30 46 C32 50 38 54 44 52 C38 50 36 42 40 36 C44 40 48 42 52 42 C50 38 50 34 54 30 C56 34 58 38 60 42 C62 40 66 40 68 40 C66 44 62 46 58 46 C62 48 64 52 62 56 C58 56 54 54 52 50 C50 54 48 60 48 60 Z" fill="#faf6ee"/>
