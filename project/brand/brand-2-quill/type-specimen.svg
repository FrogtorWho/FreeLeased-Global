<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="900" fill="#fbf8f1"/>
  <text x="40" y="56" font-size="32" font-weight="700" fill="#0a0a0a" font-family="'Source Serif 4', Georgia, serif">Type System</text>
  <text x="40" y="84" font-size="14" fill="#1f1f1f" font-style="italic">Display · Subhead · Body · Drop-cap · Mono</text>

  <g transform="translate(40,140)">
    <text font-size="14" font-weight="600" fill="#a8201a">DISPLAY · GT Sectra Bold · -0.02em</text>
    <text y="80" font-size="80" font-weight="700" fill="#0a0a0a" font-family="'Source Serif 4', Georgia, serif" letter-spacing="-1.6">A single clause</text>
    <text y="160" font-size="48" font-weight="700" fill="#0a0a0a" font-family="'Source Serif 4', Georgia, serif" letter-spacing="-1">can cost £18,000.</text>
  </g>

  <line x1="40" y1="340" x2="1160" y2="340" stroke="#0a0a0a" stroke-width="1" stroke-dasharray="2 4"/>

  <g transform="translate(40,380)">
    <text font-size="14" font-weight="600" fill="#a8201a">SUBHEAD · GT Sectra 600 · 1.20</text>
    <text y="40" font-size="24" font-weight="600" fill="#0a0a0a" font-family="'Source Serif 4', Georgia, serif">Why we cite every statute we read.</text>
    <text y="80" font-size="20" font-weight="600" fill="#0a0a0a" font-family="'Source Serif 4', Georgia, serif">A short note on provenance.</text>
  </g>

  <g transform="translate(540,380)">
    <text font-size="14" font-weight="600" fill="#a8201a">BODY · Source Serif 4 · 1.65</text>
    <text y="40" font-size="18" fill="#0a0a0a" font-family="'Source Serif 4', Georgia, serif">Your landlord must give 24 hours'</text>
    <text y="64" font-size="18" fill="#0a0a0a" font-family="'Source Serif 4', Georgia, serif">written notice before entering the</text>
    <text y="88" font-size="18" fill="#0a0a0a" font-family="'Source Serif 4', Georgia, serif">demised premises.</text>
    <text y="124" font-size="16" font-style="italic" fill="#1f1f1f" font-family="'Source Serif 4', Georgia, serif">— s.27(3)(a) Landlord and Tenant</text>
    <text y="146" font-size="16" font-style="italic" fill="#1f1f1f" font-family="'Source Serif 4', Georgia, serif">Act 1985, as amended.</text>
  </g>

  <line x1="40" y1="600" x2="1160" y2="600" stroke="#0a0a0a" stroke-width="1" stroke-dasharray="2 4"/>

  <g transform="translate(40,640)">
    <text font-size="14" font-weight="600" fill="#a8201a">DROP-CAP · GT Sectra Display · 96u</text>
    <text font-size="96" font-weight="700" fill="#a8201a" font-family="'Source Serif 4', Georgia, serif">T</text>
    <text x="80" font-size="18" fill="#0a0a0a" font-family="'Source Serif 4', Georgia, serif">he desk has decided that the</text>
    <text y="24" x="80" font-size="18" fill="#0a0a0a" font-family="'Source Serif 4', Georgia, serif">fourth clause of the lease, which</text>
    <text y="48" x="80" font-size="18" fill="#0a0a0a" font-family="'Source Serif 4', Georgia, serif">permits entry at any hour, is —</text>
  </g>

  <g transform="translate(700,640)">
    <text font-size="14" font-weight="600" fill="#a8201a">UI · Inter · 14/13</text>
    <text y="40" font-size="14" font-weight="500" fill="#0a0a0a">Sign-off queue · 3 pending</text>
    <text y="64" font-size="13" fill="#1f1f1f">avg decision: 2m 14s</text>
    <text y="100" font-size="14" font-weight="600" fill="#a8201a">MONO · JetBrains Mono · 14</text>
    <text y="124" font-size="14" font-family="ui-monospace, monospace" fill="#0a0a0a">s.27(3)(a) LTA 1985</text>
    <text y="148" font-size="14" font-family="ui-monospace, monospace" fill="#1f1f1f">doc_id: abc-123-def</text>
  </g>
