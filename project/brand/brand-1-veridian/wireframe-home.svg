<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="900" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0b1220"/>
  <text x="40" y="40" font-size="18" font-weight="700" fill="#f8fafc" font-family="'Source Serif 4', Georgia, serif">FreeLeased</text>
  <text x="180" y="40" font-size="14" fill="#94a3b8">Product · Docs · Pitch · Brand</text>
  <rect x="1040" y="20" width="120" height="32" rx="6" fill="#2563eb"/>
  <text x="1100" y="40" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">Run demo</text>

  <rect x="0" y="64" width="1200" height="520" fill="#0b1220"/>
  <text x="80" y="220" font-size="72" font-weight="700" fill="#f8fafc" font-family="'Source Serif 4', Georgia, serif">Read your lease</text>
  <text x="80" y="304" font-size="72" font-weight="700" fill="#10b981" font-family="'Source Serif 4', Georgia, serif">like a lawyer.</text>
  <text x="80" y="360" font-size="20" fill="#cbd5e1">Provenance-tracked lease intelligence. $0 compute.</text>
  <text x="80" y="388" font-size="20" fill="#cbd5e1">9 jurisdictions · 40+ statutes · every claim cited.</text>
  <rect x="80" y="420" width="160" height="48" rx="8" fill="#2563eb"/>
  <text x="160" y="450" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">Try the demo</text>
  <rect x="260" y="420" width="160" height="48" rx="8" fill="none" stroke="#f8fafc" stroke-width="1"/>
  <text x="340" y="450" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">Read the pitch</text>

  <g transform="translate(80,624)">
    <rect width="320" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="20" y="20" width="80" height="6" rx="3" fill="#2563eb"/>
    <text x="20" y="60" font-size="20" font-weight="600" fill="#0f172a">Lease fairness</text>
    <text x="20" y="92" font-size="13" fill="#475569">Clauses flagged by statute,</text>
    <text x="20" y="110" font-size="13" fill="#475569">never by profile.</text>
    <line x1="20" y1="140" x2="300" y2="140" stroke="#e2e8f0"/>
    <text x="20" y="166" font-size="12" fill="#64748b">s.27(3)(a) LTA 1985</text>
    <text x="20" y="186" font-size="12" fill="#64748b">evidence: verified (3)</text>
  </g>

  <g transform="translate(440,624)">
    <rect width="320" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="20" y="20" width="80" height="6" rx="3" fill="#10b981"/>
    <text x="20" y="60" font-size="20" font-weight="600" fill="#0f172a">HITL sign-off</text>
    <text x="20" y="92" font-size="13" fill="#475569">Every resident-facing claim</text>
    <text x="20" y="110" font-size="13" fill="#475569">approved by a human.</text>
    <line x1="20" y1="140" x2="300" y2="140" stroke="#e2e8f0"/>
    <text x="20" y="166" font-size="12" fill="#64748b">urgency: 3 pending</text>
    <text x="20" y="186" font-size="12" fill="#64748b">avg decision: 2m 14s</text>
  </g>

  <g transform="translate(800,624)">
    <rect width="320" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="20" y="20" width="80" height="6" rx="3" fill="#f59e0b"/>
    <text x="20" y="60" font-size="20" font-weight="600" fill="#0f172a">Provenance native</text>
    <text x="20" y="92" font-size="13" fill="#475569">Every claim carries the source</text>
    <text x="20" y="110" font-size="13" fill="#475569">it came from. Always.</text>
    <line x1="20" y1="140" x2="300" y2="140" stroke="#e2e8f0"/>
    <text x="20" y="166" font-size="12" fill="#64748b">40+ verified statutes</text>
    <text x="20" y="186" font-size="12" fill="#64748b">9 jurisdictions</text>
  </g>

  <text x="600" y="880" font-size="11" fill="#94a3b8" text-anchor="middle">wireframe-home.svg · FreeLeased landing · Veridian theme</text>
