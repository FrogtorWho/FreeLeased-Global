<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="900" fill="#fff7ed"/>
  <text x="40" y="56" font-size="32" font-weight="700" fill="#3a1f29" font-family="'Source Serif 4', Georgia, serif">Type System</text>
  <text x="40" y="84" font-size="14" font-style="italic" fill="#7c2d3a">Fraunces · Inter · JetBrains Mono</text>

  <g transform="translate(40,140)">
    <text font-size="14" font-weight="600" fill="#fb7185">DISPLAY · FRAUNCES 700 · -0.03em</text>
    <text y="100" font-size="96" font-weight="700" fill="#3a1f29" font-family="'Source Serif 4', Georgia, serif" letter-spacing="-2.8">Reading your</text>
    <text y="200" font-size="96" font-weight="700" fill="#3a1f29" font-family="'Source Serif 4', Georgia, serif" letter-spacing="-2.8">lease, together.</text>
  </g>

  <line x1="40" y1="380" x2="1160" y2="380" stroke="#fb7185" stroke-width="1" stroke-dasharray="6 4"/>

  <g transform="translate(40,420)">
    <text font-size="14" font-weight="600" fill="#fb7185">SUBHEAD · INTER 600 · 1.30</text>
    <text y="40" font-size="24" font-weight="600" fill="#3a1f29">Let's look at clause 4 together.</text>
    <text y="80" font-size="20" font-weight="600" fill="#3a1f29">A friendly note on provenance.</text>
  </g>

  <g transform="translate(580,420)">
    <text font-size="14" font-weight="600" fill="#fb7185">BODY · INTER · 1.60</text>
    <text y="40" font-size="18" fill="#3a1f29">Your landlord must give 24 hours'</text>
    <text y="64" font-size="18" fill="#3a1f29">notice before entry. We cite the source</text>
    <text y="88" font-size="18" fill="#3a1f29">so you can verify.</text>
    <text y="124" font-size="14" fill="#7c2d3a">— s.27(3)(a) LTA 1985, as amended.</text>
  </g>

  <line x1="40" y1="640" x2="1160" y2="640" stroke="#fb7185" stroke-width="1" stroke-dasharray="6 4"/>

  <g transform="translate(40,680)">
    <text font-size="14" font-weight="600" fill="#fb7185">UI · INTER · 18/16/14</text>
    <text y="40" font-size="18" font-weight="500" fill="#3a1f29">Heading 18</text>
    <text y="68" font-size="16" font-weight="500" fill="#3a1f29">Heading 16</text>
    <text y="96" font-size="14" font-weight="400" fill="#7c2d3a">Body 14 — captions, helper, metadata</text>
  </g>

  <g transform="translate(700,680)">
    <text font-size="14" font-weight="600" fill="#fb7185">MONO · JETBRAINS · 14</text>
    <text y="40" font-size="14" font-family="ui-monospace, monospace" fill="#3a1f29">s.27(3)(a) LTA 1985</text>
    <text y="64" font-size="14" font-family="ui-monospace, monospace" fill="#3a1f29">doc_id: abc-123-def</text>
    <text y="88" font-size="14" font-family="ui-monospace, monospace" fill="#7c2d3a">evidence: verified (3)</text>
  </g>

  <g transform="translate(40,800)">
    <circle cx="20" cy="20" r="20" fill="#fb7185"/>
    <ellipse cx="18" cy="22" rx="11" ry="8" fill="#fff7ed"/>
    <path d="M29 18 L36 14 L36 28 L29 26 Z" fill="#fff7ed"/>
    <circle cx="14" cy="20" r="2" fill="#3a1f29"/>
    <text x="56" y="26" font-size="13" fill="#3a1f29">clownfish · brand mascot · the leaseholder navigating the reef of clauses</text>
  </g>
</svg>
