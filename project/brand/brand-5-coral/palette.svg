    <text x="16" y="180" font-size="13" font-family="ui-monospace, monospace" fill="#fff7ed">#3a1f29</text>
  </g>
  <g transform="translate(1040,120)">
    <rect width="120" height="200" rx="24" fill="#fff7ed" stroke="#3a1f29" stroke-width="1"/>
    <text x="16" y="32" font-size="13" font-weight="500" fill="#3a1f29">Paper</text>
    <text x="16" y="156" font-size="20" font-weight="700" fill="#3a1f29" font-family="'Source Serif 4', Georgia, serif">Seashell</text>
