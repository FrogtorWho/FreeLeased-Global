    <text x="16" y="32" font-size="13" font-weight="500" fill="#fff7ed">Primary</text>
    <text x="16" y="156" font-size="22" font-weight="700" fill="#fff7ed" font-family="'Source Serif 4', Georgia, serif">Coral Reef</text>
    <text x="16" y="180" font-size="13" font-family="ui-monospace, monospace" fill="#fff7ed">#fb7185</text>
  </g>
  <g transform="translate(240,120)">
    <rect width="180" height="200" rx="24" fill="#38bdf8"/>
