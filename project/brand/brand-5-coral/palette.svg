    <text x="0" y="40">Lagoon Blue #38bdf8 · 2.51:1 · AA Large (display only)</text>
    <text x="0" y="58">Sand Yellow #fcd34d · 1.50:1 · accent only (icons/dots)</text>
    <text x="0" y="76">Deep Coral #7c2d3a · 7.83:1 · AAA</text>
    <text x="0" y="94">Plum #3a1f29 · 11.40:1 · AAA · body text</text>
