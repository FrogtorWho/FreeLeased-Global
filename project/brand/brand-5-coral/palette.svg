    <text x="16" y="156" font-size="22" font-weight="700" fill="#3a1f29" font-family="'Source Serif 4', Georgia, serif">Lagoon Blue</text>
    <text x="16" y="180" font-size="13" font-family="ui-monospace, monospace" fill="#3a1f29">#38bdf8</text>
  </g>
  <g transform="translate(440,120)">
    <rect width="180" height="200" rx="24" fill="#fcd34d"/>
    <text x="16" y="32" font-size="13" font-weight="500" fill="#3a1f29">Accent</text>
    <text x="16" y="156" font-size="22" font-weight="700" fill="#3a1f29" font-family="'Source Serif 4', Georgia, serif">Sand Yellow</text>
    <text x="16" y="180" font-size="13" font-family="ui-monospace, monospace" fill="#3a1f29">#fcd34d</text>
  </g>
  <g transform="translate(640,120)">
    <rect width="180" height="200" rx="24" fill="#7c2d3a"/>
    <text x="16" y="32" font-size="13" font-weight="500" fill="#fff7ed">Surface</text>
    <text x="16" y="156" font-size="22" font-weight="700" fill="#fff7ed" font-family="'Source Serif 4', Georgia, serif">Deep Coral</text>
    <text x="16" y="180" font-size="13" font-family="ui-monospace, monospace" fill="#fff7ed">#7c2d3a</text>
  </g>
  <g transform="translate(840,120)">
    <rect width="180" height="200" rx="24" fill="#3a1f29"/>
    <text x="16" y="32" font-size="13" font-weight="500" fill="#fff7ed">Ink</text>
