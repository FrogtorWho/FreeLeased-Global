<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="480" fill="#fff7ed"/>
  <text x="40" y="56" font-size="28" font-weight="700" fill="#3a1f29" font-family="'Source Serif 4', Georgia, serif">Coral — Palette</text>
  <text x="40" y="84" font-size="14" fill="#7c2d3a">6 tokens · WCAG AA on Paper #fff7ed</text>

  <g transform="translate(40,120)">
