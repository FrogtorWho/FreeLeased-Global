name: Deploy docs-site to GitHub Pages

# ---------------------------------------------------------------------------
# Phase 14 / TASK 2 — Utility-first: deploy the static docs-site/ to
# GitHub Pages automatically on every push to main that touches docs-site/**.
#
# Notes:
#   - We deliberately use a DIFFERENT filename from `ci.yml` because
#     `ci.yml` was filter-branch-removed in Phase 4 (per MEMORY.md).
#   - This workflow NEVER edits generated code, never touches bun.lock,
#     never installs deps. It's a pure static-file publish.
#   - Public URL pattern: https://<org>.github.io/<repo>/
#
# Trigger guard: only run when docs-site/** changes on main.
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy-docs-site.yml"
  workflow_dispatch:
    # Manual trigger from the Actions tab — for one-off deploys.

# We need write perms to create the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't waste runner minutes on in-flight PRs from forks.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test the deployed URL
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Deployed to: $URL"
          for path in / /index.html /story.html /truth.html /pricing.html /pilot.html /docs.html /legal.html /team.html /sitemap.xml; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL$path")
            echo "  $CODE  $URL$path"
            if [[ "$CODE" != "200" && "$CODE" != "301" && "$CODE" != "302" ]]; then
              echo "::warning::Non-OK status $CODE on $URL$path"
            fi
          done

      - name: Record the URL in the workflow run summary
        run: |
          {
            echo "### docs-site deployed"
            echo ""
            echo "Public URL: \`${{ steps.deployment.outputs.page_url }}\`"
            echo ""
            echo "Pages smoke-tested:"
            echo "- /"
            echo "- /index.html"
            echo "- /story.html"
            echo "- /truth.html"
            echo "- /pricing.html"
            echo "- /pilot.html"
            echo "- /docs.html"
            echo "- /legal.html"
            echo "- /team.html"
            echo "- /sitemap.xml"
          } >> "$GITHUB_STEP_SUMMARY"